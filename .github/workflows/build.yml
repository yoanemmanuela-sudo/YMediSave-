name: Build YMediSave APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Récupération du code
      uses: actions/checkout@v4
      
    - name: Configuration de Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - name: Configuration de Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Installer Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Remplacement Automatique des Fichiers & Plugins Natifs (Mémoire, Voix Maguy IA, Égaliseur, AdMob, OTA)
      run: |
        pip install Pillow
        cat << 'EOF_PY' > setup_all.py
        import os, subprocess, base64, zlib
        from PIL import Image, ImageDraw
        import xml.etree.ElementTree as ET

        FILES = {
            'pubspec.yaml': '',
            'lib/features/splash/splash_screen.dart': '',
            'lib/main.dart': '',
            'version.json': '',
        }
        for path, b64_data in FILES.items():
            if os.path.dirname(path):
                os.makedirs(os.path.dirname(path), exist_ok=True)
            raw = zlib.decompress(base64.b64decode(b64_data))
            with open(path, 'wb') as f:
                f.write(raw)

        img = Image.new('RGB', (512, 512), color=(15, 15, 20))
        draw = ImageDraw.Draw(img)
        draw.polygon([(256, 80), (420, 380), (92, 380)], outline=(124, 58, 237), width=12)
        draw.polygon([(256, 130), (370, 340), (142, 340)], outline=(8, 145, 178), width=8)
        for i in range(25):
            draw.line([(200+i, 180), (256, 260)], fill=(124, 58, 237), width=2)
            draw.line([(312-i, 180), (256, 260)], fill=(124, 58, 237), width=2)
            draw.line([(243+i, 260), (243+i, 320)], fill=(8, 145, 178), width=2)
        for pos, col in [((100,100,150,150),(236,72,153)), ((362,100,412,150),(239,68,68)), ((100,362,150,412),(14,165,233)), ((362,362,412,412),(34,197,94))]:
            draw.ellipse(pos, fill=col)
        img.save('icon.png')

        subprocess.run("rm -rf android ios && flutter create --platforms=android --org com.ymedisave --project-name ymedisave /tmp/ym_tmp && cp -r /tmp/ym_tmp/android . && rm -rf /tmp/ym_tmp", shell=True, check=True)
        os.makedirs('android/app/src/main/res/xml', exist_ok=True)
        with open('android/app/src/main/res/xml/provider_paths.xml', 'w') as f:
            f.write('<?xml version="1.0" encoding="utf-8"?>\n<paths><external-path name="external_files" path="."/></paths>')

        m_path = 'android/app/src/main/AndroidManifest.xml'
        ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
        tree = ET.parse(m_path)
        root = tree.getroot()
        permissions = [
            'INTERNET', 'ACCESS_NETWORK_STATE', 'RECORD_AUDIO', 'MODIFY_AUDIO_SETTINGS',
            'READ_EXTERNAL_STORAGE', 'WRITE_EXTERNAL_STORAGE', 'MANAGE_EXTERNAL_STORAGE',
            'READ_MEDIA_AUDIO', 'READ_MEDIA_VIDEO', 'READ_MEDIA_IMAGES', 'WAKE_LOCK',
            'FOREGROUND_SERVICE', 'FOREGROUND_SERVICE_MEDIA_PLAYBACK', 'POST_NOTIFICATIONS',
            'REQUEST_INSTALL_PACKAGES', 'com.google.android.gms.permission.AD_ID',
        ]
        for p in permissions:
            perm_name = p if p.startswith('com.') else f'android.permission.{p}'
            ET.SubElement(root, 'uses-permission', {'{http://schemas.android.com/apk/res/android}name': perm_name})
        app = root.find('application')
        if app is not None:
            app.set('{http://schemas.android.com/apk/res/android}label', 'YMediSave')
            app.set('{http://schemas.android.com/apk/res/android}usesCleartextTraffic', 'true')
            app.set('{http://schemas.android.com/apk/res/android}requestLegacyExternalStorage', 'true')
            ET.SubElement(app, 'meta-data', {
                '{http://schemas.android.com/apk/res/android}name': 'com.google.android.gms.ads.APPLICATION_ID',
                '{http://schemas.android.com/apk/res/android}value': 'ca-app-pub-3940256099942544~3347511713'
            })
            prov = ET.SubElement(app, 'provider', {
                '{http://schemas.android.com/apk/res/android}name': 'vn.hunghd.flutterdownloader.DownloadedFileProvider',
                '{http://schemas.android.com/apk/res/android}authorities': 'com.ymedisave.app.flutter_downloader.provider',
                '{http://schemas.android.com/apk/res/android}exported': 'false',
                '{http://schemas.android.com/apk/res/android}grantUriPermissions': 'true'
            })
            ET.SubElement(prov, 'meta-data', {
                '{http://schemas.android.com/apk/res/android}name': 'android.support.FILE_PROVIDER_PATHS',
                '{http://schemas.android.com/apk/res/android}resource': '@xml/provider_paths'
            })
        tree.write(m_path, encoding='utf-8', xml_declaration=True)
        EOF_PY
        python3 setup_all.py
        git config user.name "YoartTech-Bot"
        git config user.email "yoarttech@users.noreply.github.com"
        git add pubspec.yaml lib/main.dart lib/features/splash/splash_screen.dart version.json icon.png
        if ! git diff --cached --quiet; then
          git commit -m "Mise à jour automatique complète YMediSave v1.1.0+13 [skip ci]"
          git push || true
        fi

    - name: Compilation Finale de l'APK YMediSave
      run: |
        flutter pub get
        dart run flutter_launcher_icons
        cat << 'EOF_PATCH' > patch_gradle.py
        import os, re
        pub_cache = os.path.expanduser('~/.pub-cache/hosted/pub.dev')
        for root_dir, _, files in os.walk(pub_cache):
            if os.path.basename(root_dir) == 'android' and ('build.gradle' in files or 'build.gradle.kts' in files):
                bg_file = 'build.gradle.kts' if 'build.gradle.kts' in files else 'build.gradle'
                bg_path = os.path.join(root_dir, bg_file)
                with open(bg_path, 'r', encoding='utf-8') as f:
                    c = f.read()
                if bg_file.endswith('.kts'):
                    c = re.sub(r'compileSdk\s*=\s*[^\n]+', 'compileSdk = 36', c)
                    c += '\nandroid {\n    compileSdk = 36\n}\n'
                else:
                    c = re.sub(r'compileSdkVersion\s+[^\n]+', 'compileSdkVersion 36', c)
                    c = re.sub(r'compileSdk\s*=?\s*[^\n]+', 'compileSdk 36', c)
                    c += '\nandroid {\n    compileSdkVersion 36\n}\n'
                if 'on_audio_query' in root_dir:
                    c = re.sub(r"jvmTarget\s*=\s*['\"].*?['\"]", 'jvmTarget = "17"', c)
                    c += '\nandroid {\n    namespace "com.lucasjosino.on_audio_query"\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }\n}\nkotlin {\n    jvmToolchain(17)\n}\n'
                with open(bg_path, 'w', encoding='utf-8') as f:
                    f.write(c)
        for app_bg in ['android/app/build.gradle.kts', 'android/app/build.gradle']:
            if os.path.exists(app_bg):
                with open(app_bg, 'r', encoding='utf-8') as f:
                    c = f.read()
                c = re.sub(r'namespace\s*=?\s*["\'][^"\']+["\']', 'namespace = "com.ymedisave.app"', c)
                c = re.sub(r'applicationId\s*=?\s*["\'][^"\']+["\']', 'applicationId = "com.ymedisave.app"', c)
                c = re.sub(r'compileSdk\s*=\s*[^\n]+', 'compileSdk = 36', c)
                c = re.sub(r'compileSdkVersion\s+[^\n]+', 'compileSdkVersion 36', c)
                c = re.sub(r'minSdk\s*=\s*[^\n]+', 'minSdk = 21\n        multiDexEnabled = true', c)
                c = re.sub(r'minSdkVersion\s+[^\n]+', 'minSdkVersion 21\n        multiDexEnabled true', c)
                with open(app_bg, 'w', encoding='utf-8') as f:
                    f.write(c)
        EOF_PATCH
        python3 patch_gradle.py
        echo "org.gradle.jvmargs=-Xmx3584M -XX:MaxMetaspaceSize=1024M" >> android/gradle.properties
        echo "android.newDsl=false" >> android/gradle.properties
        flutter build apk --release --no-tree-shake-icons
      
    - name: Sauvegarde de l'APK
      uses: actions/upload-artifact@v4
      with:
        name: YMediSave-APK
        path: build/app/outputs/flutter-apk/app-release.apk

