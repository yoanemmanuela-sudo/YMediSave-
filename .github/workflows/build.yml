name: Build YMediSave APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Récupération du code
      uses: actions/checkout@v4
      
    - name: Configuration de Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - name: Configuration de Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Préparation propre du projet Android sans écraser lib
      run: |
        cp -r lib /tmp/lib_backup
        cp pubspec.yaml /tmp/pubspec_backup.yaml
        flutter create --org com.ymedisave.app --project-name ymedisave .
        rm -rf lib test
        mv /tmp/lib_backup lib
        mv /tmp/pubspec_backup.yaml pubspec.yaml
        
    - name: Téléchargement des dépendances
      run: flutter pub get

    - name: Vérification du code Dart
      run: flutter analyze --no-fatal-infos --no-fatal-warnings
      
    - name: Compilation de l'APK Android
      run: flutter build apk --release
      
    - name: Sauvegarde de l'APK
      uses: actions/upload-artifact@v4
      with:
        name: YMediSave-APK
        path: build/app/outputs/flutter-apk/app-release.apk
        
