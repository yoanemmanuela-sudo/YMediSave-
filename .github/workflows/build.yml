name: Build YMediSave APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Récupération du code
      uses: actions/checkout@v4
      
    - name: Configuration de Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - name: Configuration de Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Installer l'outil de dessin pour le logo
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Le robot Yo'art Tech dessine le logo officiel
      run: |
        pip install Pillow
        cat << 'EOF' > generate_icon.py
        from PIL import Image, ImageDraw
        size = 512
        img = Image.new('RGB', (size, size))
        draw = ImageDraw.Draw(img)
        c1, c2 = (124, 58, 237), (8, 145, 178)
        for y in range(size):
            for x in range(size):
                f = (x + y) / (2 * size)
                img.putpixel((x, y), (int(c1[0] + (c2[0] - c1[0]) * f), int(c1[1] + (c2[1] - c1[1]) * f), int(c1[2] + (c2[2] - c1[2]) * f)))
        draw.polygon([(190, 170), (190, 342), (350, 256)], fill=(255, 255, 255))
        img.save('icon.png')
        EOF
        python generate_icon.py

    - name: Préparation propre du projet Android
      run: |
        cp -r lib /tmp/lib_backup
        cp pubspec.yaml /tmp/pubspec_backup.yaml
        flutter create --org com.ymedisave.app --project-name ymedisave .
        rm -rf lib test
        mv /tmp/lib_backup lib
        mv /tmp/pubspec_backup.yaml pubspec.yaml
        
    - name: Téléchargement des dépendances
      run: flutter pub get

    - name: Intégration définitive du logo dans le téléphone
      run: dart run flutter_launcher_icons

    - name: Vérification du code Dart
      run: flutter analyze --no-fatal-infos --no-fatal-warnings
      
    - name: Compilation de l'APK Android
      run: flutter build apk --release
      
    - name: Sauvegarde de l'APK
      uses: actions/upload-artifact@v4
      with:
        name: YMediSave-APK
        path: build/app/outputs/flutter-apk/app-release.apk
        
