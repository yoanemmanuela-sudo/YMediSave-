name: Build YMediSave APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Récupération du code
      uses: actions/checkout@v4
      
    - name: Configuration de Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - name: Configuration de Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Installer l'outil de dessin Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Le robot Yo'art Tech dessine le NOUVEAU LOGO
      run: |
        pip install Pillow
        cat << 'EOF' > generate_icon.py
        from PIL import Image, ImageDraw
        size = 512
        img = Image.new('RGB', (size, size), color=(15, 15, 20))
        draw = ImageDraw.Draw(img)
        draw.polygon([(256, 80), (420, 380), (92, 380)], outline=(124, 58, 237), width=12)
        draw.polygon([(256, 130), (370, 340), (142, 340)], outline=(8, 145, 178), width=8)
        for i in range(25):
            draw.line([(200+i, 180), (256, 260)], fill=(124, 58, 237), width=2)
            draw.line([(312-i, 180), (256, 260)], fill=(124, 58, 237), width=2)
            draw.line([(243+i, 260), (243+i, 320)], fill=(8, 145, 178), width=2)
        draw.ellipse([(100, 100), (150, 150)], fill=(236, 72, 153))
        draw.ellipse([(362, 100), (412, 150)], fill=(239, 68, 68))
        draw.ellipse([(100, 362), (150, 412)], fill=(14, 165, 233))
        draw.ellipse([(362, 362), (412, 412)], fill=(34, 197, 94))
        img.save('icon.png')
        EOF
        python generate_icon.py

    - name: Configuration Système Android (Propre & Isolée)
      run: |
        # Générer le dossier Android dans un espace isolé pour éviter le bug "Already watching path"
        flutter create --org com.ymedisave.app --project-name ymedisave /tmp/ymedisave_temp
        cp -r /tmp/ymedisave_temp/android .
        rm -rf /tmp/ymedisave_temp
        
        mkdir -p android/app/src/main/res/xml
        cat << 'EOF' > android/app/src/main/res/xml/provider_paths.xml
        <?xml version="1.0" encoding="utf-8"?>
        <paths><external-path name="external_files" path="."/></paths>
        EOF
        
        cat << 'EOF' > config_android.py
        import xml.etree.ElementTree as ET
        manifest_path = 'android/app/src/main/AndroidManifest.xml'
        ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
        tree = ET.parse(manifest_path)
        root = tree.getroot()
        perms = ['android.permission.INTERNET', 'android.permission.RECORD_AUDIO', 'android.permission.READ_EXTERNAL_STORAGE', 'android.permission.WRITE_EXTERNAL_STORAGE', 'android.permission.WAKE_LOCK', 'android.permission.FOREGROUND_SERVICE', 'android.permission.POST_NOTIFICATIONS']
        for p in perms:
            ET.SubElement(root, 'uses-permission', {'{http://schemas.android.com/apk/res/android}name': p})
        app = root.find('application')
        if app is not None:
            app.set('{http://schemas.android.com/apk/res/android}label', 'YMediSave')
            provider = ET.SubElement(app, 'provider', {'{http://schemas.android.com/apk/res/android}name': 'vn.hunghd.flutterdownloader.DownloadedFileProvider', '{http://schemas.android.com/apk/res/android}authorities': 'com.ymedisave.app.flutter_downloader.provider', '{http://schemas.android.com/apk/res/android}exported': 'false', '{http://schemas.android.com/apk/res/android}grantUriPermissions': 'true'})
            ET.SubElement(provider, 'meta-data', {'{http://schemas.android.com/apk/res/android}name': 'android.support.FILE_PROVIDER_PATHS', '{http://schemas.android.com/apk/res/android}resource': '@xml/provider_paths'})
        tree.write(manifest_path, encoding='utf-8', xml_declaration=True)
        EOF
        python config_android.py

    - name: Compilation de l'APK YMediSave (Compatible KTS)
      run: |
        flutter pub get
        dart run flutter_launcher_icons
        
        # 1. Patch du plugin on_audio_query_android (Namespace + SDK 35 + Java 17)
        find ~/.pub-cache/hosted/pub.dev -name "build.gradle" -path "*/on_audio_query_android-*/android/build.gradle" -exec sed -i '/android {/a \    namespace "com.lucasjosino.on_audio_query"\n    compileSdkVersion 35\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }' {} +
        find ~/.pub-cache/hosted/pub.dev -name "build.gradle" -path "*/on_audio_query_android-*/android/build.gradle" -exec sed -i 's/jvmTarget = .*/jvmTarget = "17"/g' {} +
        
        # 2. Mise à jour du vrai fichier android/app/build.gradle.kts pour Android 35 et Multidex
        if [ -f "android/app/build.gradle.kts" ]; then
          sed -i 's/compileSdk = .*/compileSdk = 35/g' android/app/build.gradle.kts
          sed -i 's/minSdk = .*/minSdk = 21\n        multiDexEnabled = true/g' android/app/build.gradle.kts
        fi
        
        # 3. Synchronisation globale Kotlin JVM 17 dans android/build.gradle.kts
        if [ -f "android/build.gradle.kts" ]; then
          cat << 'EOF' >> android/build.gradle.kts

        subprojects {
            tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
                kotlinOptions {
                    jvmTarget = "17"
                }
            }
            tasks.withType<JavaCompile>().configureEach {
                sourceCompatibility = "17"
                targetCompatibility = "17"
            }
        }
        EOF
        fi
        
        # 4. Compilation propre (sans le mode -v qui sature l'affichage)
        flutter build apk --release
      
    - name: Sauvegarde de l'APK
      uses: actions/upload-artifact@v4
      with:
        name: YMediSave-APK
        path: build/app/outputs/flutter-apk/app-release.apk
        
