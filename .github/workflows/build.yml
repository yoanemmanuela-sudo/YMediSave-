name: Build YMediSave APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Récupération du code
      uses: actions/checkout@v4
      
    - name: Configuration de Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - name: Configuration de Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Installer l'outil de dessin Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Le robot Yo'art Tech dessine le NOUVEAU LOGO
      run: |
        pip install Pillow
        cat << 'EOF' > generate_icon.py
        from PIL import Image, ImageDraw
        size = 512
        img = Image.new('RGB', (size, size), color=(15, 15, 20))
        draw = ImageDraw.Draw(img)
        draw.polygon([(256, 80), (420, 380), (92, 380)], outline=(124, 58, 237), width=12)
        draw.polygon([(256, 130), (370, 340), (142, 340)], outline=(8, 145, 178), width=8)
        for i in range(25):
            draw.line([(200+i, 180), (256, 260)], fill=(124, 58, 237), width=2)
            draw.line([(312-i, 180), (256, 260)], fill=(124, 58, 237), width=2)
            draw.line([(243+i, 260), (243+i, 320)], fill=(8, 145, 178), width=2)
        draw.ellipse([(100, 100), (150, 150)], fill=(236, 72, 153))
        draw.ellipse([(362, 100), (412, 150)], fill=(239, 68, 68))
        draw.ellipse([(100, 362), (150, 412)], fill=(14, 165, 233))
        draw.ellipse([(362, 362), (412, 412)], fill=(34, 197, 94))
        img.save('icon.png')
        EOF
        python generate_icon.py

    - name: Configuration Système Android (Propre & Isolée)
      run: |
        rm -rf android ios
        flutter create --platforms=android --org com.ymedisave.app --project-name ymedisave /tmp/ymedisave_temp
        cp -r /tmp/ymedisave_temp/android .
        rm -rf /tmp/ymedisave_temp
        
        mkdir -p android/app/src/main/res/xml
        cat << 'EOF' > android/app/src/main/res/xml/provider_paths.xml
        <?xml version="1.0" encoding="utf-8"?>
        <paths><external-path name="external_files" path="."/></paths>
        EOF
        
        cat << 'EOF' > config_android.py
        import xml.etree.ElementTree as ET
        manifest_path = 'android/app/src/main/AndroidManifest.xml'
        ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
        tree = ET.parse(manifest_path)
        root = tree.getroot()
        perms = ['android.permission.INTERNET', 'android.permission.RECORD_AUDIO', 'android.permission.READ_EXTERNAL_STORAGE', 'android.permission.WRITE_EXTERNAL_STORAGE', 'android.permission.WAKE_LOCK', 'android.permission.FOREGROUND_SERVICE', 'android.permission.POST_NOTIFICATIONS']
        for p in perms:
            ET.SubElement(root, 'uses-permission', {'{http://schemas.android.com/apk/res/android}name': p})
        app = root.find('application')
        if app is not None:
            app.set('{http://schemas.android.com/apk/res/android}label', 'YMediSave')
            provider = ET.SubElement(app, 'provider', {'{http://schemas.android.com/apk/res/android}name': 'vn.hunghd.flutterdownloader.DownloadedFileProvider', '{http://schemas.android.com/apk/res/android}authorities': 'com.ymedisave.app.flutter_downloader.provider', '{http://schemas.android.com/apk/res/android}exported': 'false', '{http://schemas.android.com/apk/res/android}grantUriPermissions': 'true'})
            ET.SubElement(provider, 'meta-data', {'{http://schemas.android.com/apk/res/android}name': 'android.support.FILE_PROVIDER_PATHS', '{http://schemas.android.com/apk/res/android}resource': '@xml/provider_paths'})
        tree.write(manifest_path, encoding='utf-8', xml_declaration=True)
        EOF
        python config_android.py

    - name: Compilation Finale de l'APK YMediSave
      run: |
        sed -i 's/ios: true/ios: false/g' pubspec.yaml
        
        flutter pub get
        dart run flutter_launcher_icons
        
        # Script Python intelligent pour réparer TOUS les plugins et l'application
        cat << 'EOF' > patch_all.py
        import os, glob, re
        import xml.etree.ElementTree as ET

        # 1. Patcher tous les plugins dans le cache pub.dev
        pub_cache = os.path.expanduser('~/.pub-cache/hosted/pub.dev')
        for root_dir, dirs, files in os.walk(pub_cache):
            if os.path.basename(root_dir) == 'android' and 'build.gradle' in files:
                bg_path = os.path.join(root_dir, 'build.gradle')
                manifest_path = os.path.join(root_dir, 'src/main/AndroidManifest.xml')
                
                with open(bg_path, 'r', encoding='utf-8') as f:
                    content = f.read()
                
                # Extraire le package du Manifest si namespace est manquant
                pkg_name = None
                if os.path.exists(manifest_path):
                    try:
                        tree = ET.parse(manifest_path)
                        pkg_name = tree.getroot().attrib.get('package')
                    except Exception:
                        pass
                if not pkg_name and 'on_audio_query' in root_dir:
                    pkg_name = 'com.lucasjosino.on_audio_query'
                
                if 'namespace' not in content and pkg_name:
                    content = re.sub(r'android\s*\{', f'android {{\n    namespace "{pkg_name}"', content, count=1)
                
                # Forcer compileSdkVersion 35 dans chaque plugin
                content = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 35', content)
                content = re.sub(r'compileSdk\s*=?\s*\d+', 'compileSdk = 35', content)
                
                # Aligner Java et Kotlin sur 17 dans chaque plugin
                content = re.sub(r'JavaVersion\.VERSION_1_8', 'JavaVersion.VERSION_17', content)
                content = re.sub(r'JavaVersion\.VERSION_11', 'JavaVersion.VERSION_17', content)
                content = re.sub(r"jvmTarget\s*=\s*['\"].*?['\"]", 'jvmTarget = "17"', content)
                
                with open(bg_path, 'w', encoding='utf-8') as f:
                    f.write(content)

        # 2. Patcher android/app/build.gradle.kts (ou .gradle)
        for app_bg in ['android/app/build.gradle.kts', 'android/app/build.gradle']:
            if os.path.exists(app_bg):
                with open(app_bg, 'r', encoding='utf-8') as f:
                    c = f.read()
                c = re.sub(r'compileSdk\s*=\s*[^\n]+', 'compileSdk = 35', c)
                c = re.sub(r'compileSdkVersion\s+[^\n]+', 'compileSdkVersion 35', c)
                c = re.sub(r'minSdk\s*=\s*[^\n]+', 'minSdk = 21\n        multiDexEnabled = true', c)
                c = re.sub(r'minSdkVersion\s+[^\n]+', 'minSdkVersion 21\n        multiDexEnabled true', c)
                with open(app_bg, 'w', encoding='utf-8') as f:
                    f.write(c)
        EOF
        python patch_all.py

        # 3. Créer un fichier init.gradle universel pour synchroniser Java/Kotlin 17 sans toucher à build.gradle.kts
        mkdir -p ~/.gradle/init.d
        cat << 'EOF' > ~/.gradle/init.d/ymedisave_jvm17.gradle
        allprojects {
            tasks.withType(JavaCompile).configureEach {
                sourceCompatibility = JavaVersion.VERSION_17.toString()
                targetCompatibility = JavaVersion.VERSION_17.toString()
            }
            tasks.matching { it.name.contains("compile") && it.name.contains("Kotlin") }.configureEach { task ->
                try {
                    task.compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
                } catch (Exception e) {
                    try {
                        task.kotlinOptions.jvmTarget = "17"
                    } catch (Exception ex) {}
                }
            }
        }
        EOF

        # 4. Optimisation mémoire et désactivation de la compression d'icônes (évite les blocages CMake/AAPT2)
        echo "org.gradle.jvmargs=-Xmx3584M -XX:MaxMetaspaceSize=1024M" >> android/gradle.properties
        
        flutter build apk --release --no-tree-shake-icons
      
    - name: Sauvegarde de l'APK
      uses: actions/upload-artifact@v4
      with:
        name: YMediSave-APK
        path: build/app/outputs/flutter-apk/app-release.apk
        
