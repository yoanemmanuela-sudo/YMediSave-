name: Build YMediSave APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Récupération du code
      uses: actions/checkout@v4
      
    - name: Configuration de Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - name: Configuration de Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Installer l'outil de dessin Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Le robot Yo'art Tech dessine le logo
      run: |
        pip install Pillow
        cat << 'EOF' > generate_icon.py
        from PIL import Image, ImageDraw
        size = 512
        img = Image.new('RGB', (size, size))
        draw = ImageDraw.Draw(img)
        c1, c2 = (124, 58, 237), (8, 145, 178)
        for y in range(size):
            for x in range(size):
                f = (x + y) / (2 * size)
                img.putpixel((x, y), (int(c1[0] + (c2[0] - c1[0]) * f), int(c1[1] + (c2[1] - c1[1]) * f), int(c1[2] + (c2[2] - c1[2]) * f)))
        draw.polygon([(190, 170), (190, 342), (350, 256)], fill=(255, 255, 255))
        img.save('icon.png')
        EOF
        python generate_icon.py

    - name: Configuration des Notifications et Téléchargements Android
      run: |
        cp -r lib /tmp/lib_backup
        cp pubspec.yaml /tmp/pubspec_backup.yaml
        flutter create --org com.ymedisave.app --project-name ymedisave .
        rm -rf lib test
        mv /tmp/lib_backup lib
        mv /tmp/pubspec_backup.yaml pubspec.yaml
        
        # 1. Création du fichier de sécurité pour les téléchargements
        mkdir -p android/app/src/main/res/xml
        cat << 'EOF' > android/app/src/main/res/xml/provider_paths.xml
        <?xml version="1.0" encoding="utf-8"?>
        <paths>
            <external-path name="external_files" path="."/>
        </paths>
        EOF
        
        # 2. Injection des autorisations (Notifications, Média, Fichiers)
        cat << 'EOF' > config_android.py
        import xml.etree.ElementTree as ET
        
        manifest_path = 'android/app/src/main/AndroidManifest.xml'
        ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
        tree = ET.parse(manifest_path)
        root = tree.getroot()
        
        perms = [
            'android.permission.INTERNET',
            'android.permission.RECORD_AUDIO',
            'android.permission.ACCESS_FINE_LOCATION',
            'android.permission.ACCESS_COARSE_LOCATION',
            'android.permission.READ_EXTERNAL_STORAGE',
            'android.permission.WRITE_EXTERNAL_STORAGE',
            'android.permission.WAKE_LOCK',
            'android.permission.FOREGROUND_SERVICE',
            'android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK',
            'android.permission.FOREGROUND_SERVICE_DATA_SYNC',
            'android.permission.POST_NOTIFICATIONS'
        ]
        for p in perms:
            ET.SubElement(root, 'uses-permission', {'{http://schemas.android.com/apk/res/android}name': p})
            
        app = root.find('application')
        if app is not None:
            app.set('{http://schemas.android.com/apk/res/android}label', 'YMediSave')
            
            # Installation du moteur de téléchargement
            provider = ET.SubElement(app, 'provider', {
                '{http://schemas.android.com/apk/res/android}name': 'vn.hunghd.flutterdownloader.DownloadedFileProvider',
                '{http://schemas.android.com/apk/res/android}authorities': 'com.ymedisave.app.flutter_downloader.provider',
                '{http://schemas.android.com/apk/res/android}exported': 'false',
                '{http://schemas.android.com/apk/res/android}grantUriPermissions': 'true'
            })
            ET.SubElement(provider, 'meta-data', {
                '{http://schemas.android.com/apk/res/android}name': 'android.support.FILE_PROVIDER_PATHS',
                '{http://schemas.android.com/apk/res/android}resource': '@xml/provider_paths'
            })
            
            activity = app.find('activity')
            if activity is not None:
                intent_filter = ET.SubElement(activity, 'intent-filter')
                ET.SubElement(intent_filter, 'action', {'{http://schemas.android.com/apk/res/android}name': 'android.intent.action.VIEW'})
                ET.SubElement(intent_filter, 'category', {'{http://schemas.android.com/apk/res/android}name': 'android.intent.category.DEFAULT'})
                ET.SubElement(intent_filter, 'category', {'{http://schemas.android.com/apk/res/android}name': 'android.intent.category.BROWSABLE'})
                ET.SubElement(intent_filter, 'data', {'{http://schemas.android.com/apk/res/android}scheme': 'http'})
                ET.SubElement(intent_filter, 'data', {'{http://schemas.android.com/apk/res/android}scheme': 'https'})
                
        tree.write(manifest_path, encoding='utf-8', xml_declaration=True)
        EOF
        python config_android.py
        
    - name: Téléchargement des dépendances
      run: flutter pub get

    - name: Intégration du logo
      run: dart run flutter_launcher_icons

    - name: Vérification du code
      run: flutter analyze --no-fatal-infos --no-fatal-warnings
      
    - name: Compilation de l'APK
      run: flutter build apk --release
      
    - name: Sauvegarde de l'APK
      uses: actions/upload-artifact@v4
      with:
        name: YMediSave-APK
        path: build/app/outputs/flutter-apk/app-release.apk
        
