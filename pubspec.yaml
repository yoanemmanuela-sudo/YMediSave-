name: ymedisave
description: "YMediSave - Lecteur et gestionnaire multimédia légal et sécurisé par Yo'art Tech."
publish_to: 'none'
version: 1.0.0+13

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  webview_flutter: ^4.4.2
  palette_generator: ^0.3.3+3
  permission_handler: ^11.3.1
  video_player: ^2.8.6
  chewie: ^1.7.5
  just_audio: ^0.9.36
  flutter_downloader: ^1.11.6
  audio_service: ^0.18.12
  on_audio_query: ^2.9.0
  file_picker: ^8.0.0
  open_filex: ^4.4.0
  path_provider: ^2.1.3
  speech_to_text: ^6.6.0
  flutter_tts: ^4.0.2
  google_mobile_ads: ^5.1.0
  http: ^1.2.1
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0

dependency_overrides:
  sqflite_android: 2.4.0
  sqflite: 2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "icon.png"
