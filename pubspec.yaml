name: ymedisave
description: "YMediSave - Lecteur et gestionnaire multimédia légal et sécurisé."
publish_to: 'none'
version: 1.0.0+9

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  webview_flutter: ^4.4.2
  palette_generator: ^0.3.3+3
  permission_handler: ^11.3.1
  video_player: ^2.8.6
  chewie: ^1.7.5
  just_audio: ^0.9.36
  # --- Nouveaux Moteurs Yo'art Tech (Système Android) ---
  flutter_downloader: ^1.11.6 # Téléchargements en barre de notification
  audio_service: ^0.18.12     # Lecteur dans la barre de notification
  on_audio_query: ^3.1.12     # Scanner la mémoire interne du téléphone

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "icon.png"
  
